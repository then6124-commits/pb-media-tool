[package]
name = "pb-media"
version = "0.1.0"
description = "PB MEDIA — Muse batch tool (Tauri)"
authors = ["vu hanh"]
edition = "2021"

[lib]
name = "pb_media_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
